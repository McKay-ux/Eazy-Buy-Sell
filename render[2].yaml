services:
  - type: web
    name: eazybuysell-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eazybuysell-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: eazybuysell-db
    plan: basic-256mb
    databaseName: eazybuysell
    user: eazybuysell_user
